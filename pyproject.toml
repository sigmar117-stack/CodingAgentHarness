[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codingkit"
dynamic = ["version"]
description = "CodingKit — a coding agent harness with an observable, classifiable feedback-correction loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodingKit Contributors" }]
keywords = ["coding-agent", "llm", "feedback-loop", "agent-harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Core dependencies: lightweight, used across most modules.
# Heavy / provider-specific deps are declared as optional extras (SPEC §5.3, PLAN T6.2)
# so `pip install -e .` stays fast and works offline.
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "keyring>=24",
    "cryptography>=42",
]

[project.optional-dependencies]
# Cross-session vector memory; degrades to JSON file when unavailable.
memory = ["chromadb>=0.5"]
# Real LLM providers; MockLLMClient is always available without these.
llm = ["anthropic>=0.40", "openai>=1.30"]
# WebUI backend + static file server.
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# All extras combined.
all = ["codingkit[memory,llm,web]"]
# Test tooling.
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
codingkit = "codingkit.cli.main:app"

[project.urls]
Homepage = "https://github.com/codingkit/codingkit"

[tool.setuptools.dynamic]
version = { attr = "codingkit.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
